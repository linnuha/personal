<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsip - Pelayanan Desa</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="#">Pelayanan Desa</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="login.html">Logout</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="arsip.html">Arsip</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Formulir Arsip -->
    <div class="container mt-5">
        <h2>Formulir Pengelolaan Arsip</h2>
        <form id="arsipForm">
            <div class="form-group">
                <label for="id">ID Arsip</label>
                <input type="text" class="form-control" id="id" required>
            </div>
            <div class="form-group">
                <label for="tanggalSurat">Tanggal Surat</label>
                <input type="date" class="form-control" id="tanggalSurat" required>
            </div>
            <div class="form-group">
                <label for="nomorSurat">Nomor Surat</label>
                <input type="text" class="form-control" id="nomorSurat" required>
            </div>
            <div class="form-group">
                <label for="pengirimPenerima">Pengirim/Penerima</label>
                <input type="text" class="form-control" id="pengirimPenerima" required>
            </div>
            <div class="form-group">
                <label for="perihal">Perihal</label>
                <input type="text" class="form-control" id="perihal" required>
            </div>
            <div class="form-group">
                <label for="lampiran">Lampiran</label>
                <input type="text" class="form-control" id="lampiran" required>
            </div>
            <div class="form-group">
                <label for="tglKirim">Tgl Kirim/Diterima</label>
                <input type="date" class="form-control" id="tglKirim" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Simpan Arsip</button>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.0.5/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
