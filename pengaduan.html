</head>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="#">Pelayanan Desa</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html">Dashboard</a>

                </li>
            </ul>
        </div>
    </nav>

    <!-- Formulir Pengaduan -->
    <div class="container mt-5">
        <h2>Formulir Pengaduan</h2>
        <form id="pengaduanForm">
            <div class="form-group">
                <label for="id">ID Pengaduan</label>
                <input type="text" class="form-control" id="id" required>
            </div>
            <div class="form-group">
                <label for="nama">Nama Warga</label>
                <input type="text" class="form-control" id="nama" required>
            </div>
            <div class="form-group">
                <label for="alamat">Alamat</label>
                <input type="text" class="form-control" id="alamat" required>
            </div>
            <div class="form-group">
                <label for="telepon">Telepon</label>
                <input type="text" class="form-control" id="telepon" required>
            </div>
            <div class="form-group">
                <label for="jenisPengaduan">Jenis Pengaduan</label>
                <input type="text" class="form-control" id="jenisPengaduan" required>
            </div>
            <div class="form-group">
                <label for="isiPengaduan">Isi Pengaduan</label>
                <textarea class="form-control" id="isiPengaduan" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Kirim Pengaduan</button>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.0.5/dist/umd/popper.min.js"></script>
