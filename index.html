<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desaku - Aplikasi Desa</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&callback=initMap" async defer></script>
</head>
<body>
    <!-- Header -->
    <header>
        <h1>Desaku</h1>
        <p>Aplikasi Pengelolaan Data Desa</p>
        <button id="loginBtn">Login</button>
    </header>

    <!-- Login Section -->
    <section id="loginSection" class="hidden">
        <h2>Login</h2>
        <form id="loginForm">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Login</button>
        </form>
    </section>

    <!-- Data Input Section -->
    <section id="dataInputSection">
        <h2>Tambah Data Desa</h2>
        <form id="desaForm">
            <label for="desaName">Nama Desa:</label>
            <input type="text" id="desaName" name="desaName" required>

            <label for="desaLocation">Lokasi Desa:</label>
            <input type="text" id="desaLocation" name="desaLocation" required>

            <label for="desaPopulation">Jumlah Penduduk:</label>
            <input type="number" id="desaPopulation" name="desaPopulation" required>

            <label for="desaDescription">Deskripsi Desa:</label>
            <textarea id="desaDescription" name="desaDescription" required></textarea>

            <label for="desaCoordinates">Lokasi di Peta (Longitude, Latitude):</label>
            <input type="text" id="desaCoordinates" name="desaCoordinates" placeholder="e.g., 106.8650, -6.1750" required>

            <button type="submit">Simpan Data</button>
        </form>
    </section>

    <!-- Map Section -->
    <section id="mapSection">
        <h2>Peta Lokasi Desa</h2>
        <div id="map" style="height: 400px; width: 100%;"></div>
    </section>

    <!-- Data Table Section -->
    <section id="dataTableSection">
        <h2>Data Desa</h2>
        <table id="desaTable">
            <thead>
                <tr>
                    <th>Nama Desa</th>
                    <th>Lokasi</th>
                    <th>Jumlah Penduduk</th>
                    <th>Deskripsi</th>
                    <th>Lokasi di Peta</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data akan ditambahkan di sini -->
            </tbody>
        </table>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2025 Desaku. Semua Hak Dilindungi.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
